<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capim Gestão — Capim Dourado Shopping</title>
    <style>
      :root {
        --gold-primary: #b4903d;
        --gold-dark: #78581e;
        --gold-light: #f3ead6;
        --text-dark: #292114;
        --text-muted: #6b5e4c;
        --border-soft: #e2d9c8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #ede6d6 0%, #dcd0b8 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
      }

      main.split-card {
        width: 100%;
        max-width: 940px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 25px 50px -12px rgba(68, 49, 15, 0.2);
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
        min-height: 550px;
        border: 1px solid var(--border-soft);
      }

      section.welcome-panel {
        background: linear-gradient(160deg, #fdfbf7 0%, #f4ecdc 100%);
        border-right: 1px solid var(--border-soft);
        border-left: 6px solid var(--gold-primary);
        padding: 3rem 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .logo-wrapper {
        width: 100%;
        max-width: 340px;
      }
      .logo-wrapper img {
        width: 100%;
        height: auto;
        display: block;
        mix-blend-mode: multiply;
      }

      .brand-footer-tag {
        margin-top: 2rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold-dark);
        opacity: 0.85;
      }
      section.form-panel {
        padding: 2.75rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #ffffff;
      }

      .form-panel header {
        margin-bottom: 1.6rem;
        text-align: center;
      }

      .form-panel .eyebrow {
        display: block;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold-primary);
        margin-bottom: 0.35rem;
      }

      .form-panel h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.25rem;
        font-weight: 700;
        font-style: italic;
        color: var(--gold-dark);
        line-height: 1.1;
        margin-bottom: 0.65rem;
      }

      .pillars-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 1rem;
      }

      .pillars-bar .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: var(--gold-primary);
      }

      .form-panel header span.sub {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--gold-dark);
        border-top: 1px solid var(--border-soft);
        padding-top: 0.85rem;
      }

      .form-panel header span.sub::before,
      .form-panel header span.sub::after {
        content: "";
        width: 18px;
        height: 2px;
        background-color: var(--gold-primary);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 0.95rem;
      }

      .input-pill {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-pill > svg {
        position: absolute;
        left: 1.15rem;
        width: 18px;
        height: 18px;
        color: var(--gold-primary);
        pointer-events: none;
        z-index: 2;
      }

      .input-pill svg {
        position: absolute;
        left: 1.15rem;
        width: 18px;
        height: 18px;
        color: var(--gold-primary);
        pointer-events: none;
      }

      input,
      select {
        width: 100%;
        padding: 0.82rem 1.2rem 0.82rem 2.9rem;
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        font-size: 0.92rem;
        color: var(--text-dark);
        background-color: #fcfbf9;
        outline: none;
      }

      input:focus,
      select:focus {
        background-color: #ffffff;
        border-color: var(--gold-primary);
        box-shadow: 0 0 0 3px rgba(180, 144, 61, 0.16);
      }

      /* Dropdown Customizado (Substitui o select cinza do navegador) */
      .custom-select {
        position: relative;
        width: 100%;
      }

      .select-trigger {
        width: 100%;
        padding: 0.82rem 1.2rem 0.82rem 2.9rem;
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        font-size: 0.92rem;
        color: var(--text-muted);
        background-color: #fcfbf9;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
        transition: all 0.2s;
      }

      .select-trigger span#selected-text {
        flex: 1;
        text-align: left;
      }

      .custom-select.open .select-trigger {
        background-color: #ffffff;
        border-color: var(--gold-primary);
        box-shadow: 0 0 0 3px rgba(180, 144, 61, 0.16);
      }

      .select-trigger .arrow {
        width: 16px;
        height: 16px;
        color: var(--gold-primary);
        transition: transform 0.2s;
        position: static;
      }

      .custom-select.open .select-trigger .arrow {
        transform: rotate(180deg);
      }

      .select-options {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: #ffffff;
        border: 1px solid var(--border-soft);
        border-radius: 14px;
        box-shadow: 0 12px 24px rgba(41, 33, 20, 0.12);
        list-style: none;
        overflow: hidden;
        display: none;
        z-index: 20;
      }

      .custom-select.open .select-options {
        display: block;
      }

      .select-options li {
        padding: 0.72rem 1.2rem;
        font-size: 0.9rem;
        color: var(--text-dark);
        cursor: pointer;
        transition: background 0.15s;
      }

      .select-options li:hover,
      .select-options li.selected {
        background-color: var(--gold-light);
        color: var(--gold-dark);
        font-weight: 600;
      }

      .options-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
        color: var(--text-muted);
        padding: 0 0.5rem;
      }

      .options-row label {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        cursor: pointer;
      }
      .options-row input[type="checkbox"] {
        width: auto;
        accent-color: var(--gold-primary);
      }

      .forgot-link {
        background: none;
        border: none;
        color: var(--gold-dark);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }

      .forgot-link:hover {
        text-decoration: underline;
      }

      .btn-submit {
        margin-top: 0.3rem;
        padding: 0.9rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(90deg, #b4903d 0%, #8c6a26 100%);
        color: #ffffff;
        font-size: 0.96rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 15px -3px rgba(140, 106, 38, 0.3);
      }

      .social-section {
        margin-top: 1.35rem;
        text-align: center;
      }

      .social-divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-bottom: 0.9rem;
      }

      .social-divider::before,
      .social-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background-color: var(--border-soft);
      }

      .social-buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
      }

      .btn-social {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-color: #ffffff;
        border: 1px solid var(--border-soft);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(41, 33, 20, 0.06);
        transition:
          transform 0.2s,
          border-color 0.2s;
      }

      .btn-social:hover {
        transform: translateY(-2px);
        border-color: var(--gold-primary);
      }
      .register-hint {
        margin-top: 1rem;
        font-size: 0.78rem;
        color: var(--text-muted);
      }
      .register-hint span {
        color: var(--gold-dark);
        font-weight: 700;
      }

      @media (max-width: 768px) {
        main.split-card {
          grid-template-columns: 1fr;
        }
        section.welcome-panel {
          border-left: none;
          border-top: 6px solid var(--gold-primary);
          border-right: none;
          border-bottom: 1px solid var(--border-soft);
          padding: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="split-card">
      <section class="welcome-panel">
        <div class="logo-wrapper">
          <img
            src="assets/logo-capim-dourado.jpg"
            alt="Logo Capim Dourado Shopping"
          />
        </div>
        <span class="brand-footer-tag">Palmas • Tocantins</span>
      </section>

      <section class="form-panel">
        <header>
          <span class="eyebrow">Portal Administrativo</span>
          <h1>Capim Gestão</h1>
          <div class="pillars-bar">
            <span>Infraestrutura</span>
            <span class="dot"></span>
            <span>Ocorrências</span>
            <span class="dot"></span>
            <span>Operações</span>
          </div>
          <span class="sub">Acesso ao Sistema</span>
        </header>

        <form id="form-login">
          <div class="input-pill">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input type="email" id="email" placeholder="E-mail" required />
          </div>

          <div class="input-pill">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect width="18" height="11" x="3" y="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password"
              id="senha"
              placeholder="Senha de acesso"
              required
            />
          </div>

          <div class="input-pill">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <div class="custom-select" id="custom-perfil">
              <div class="select-trigger" id="select-trigger">
                <span id="selected-text">Supervisor Operacional</span>
                <svg
                  class="arrow"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="m6 9 6 6 6-6"></path>
                </svg>
              </div>
              <ul class="select-options" id="select-options">
                <li class="selected" data-value="Supervisor Operacional">
                  Supervisor Operacional
                </li>
                <li data-value="Administrador do Shopping">
                  Administrador do Shopping
                </li>
                <li data-value="Equipe de Manutenção">Equipe de Manutenção</li>
              </ul>
              <input type="hidden" id="perfil" value="Supervisor Operacional" />
            </div>
          </div>

          <div class="options-row">
            <label><input type="checkbox" checked /> Manter conectado</label>
            <button type="button" class="forgot-link" id="btn-forgot">
              Esqueci minha senha
            </button>
          </div>

          <button type="submit" class="btn-submit">Acessar Painel</button>
        </form>

        <div class="social-section">
          <div class="social-divider">Ou entre com</div>
          <div class="social-buttons">
            <button
              type="button"
              class="btn-social"
              id="btn-google"
              title="Entrar com Google"
            >
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M23.7 12.3c0-.7-.1-1.4-.2-2.1H12v4.5h6.6c-.3 1.5-1.1 2.8-2.4 3.7v3h3.9c2.3-2.1 3.6-5.2 3.6-9.1Z"
                />
                <path
                  fill="#34A853"
                  d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1C3.3 21.3 7.3 24 12 24Z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.3 14.2c-.2-.7-.4-1.5-.4-2.2s.1-1.5.4-2.2V6.6H1.3C.5 8.2 0 10.1 0 12s.5 3.8 1.3 5.4l4-3.2Z"
                />
                <path
                  fill="#EA4335"
                  d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4C18 1.2 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.6l4 3.1c.9-2.8 3.6-4.9 6.7-4.9Z"
                />
              </svg>
            </button>

            <button
              type="button"
              class="btn-social"
              id="btn-apple"
              title="Entrar com Apple"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#1d1d1f">
                <path
                  d="M17.1 20.3c-1 .9-2.1.8-3.1.3-1.1-.5-2.1-.5-3.2 0-1.4.6-2.2.4-3.1-.4C2.8 15.3 3.5 7.6 9.1 7.3c1.3.1 2.3.7 3.1.8 1.2-.2 2.3-.9 3.6-.8 1.5.1 2.6.7 3.4 1.8-3.1 1.9-2.4 6 .5 7.1-.6 1.5-1.3 3-2.6 4.1ZM12 7.2c-.2-2.2 1.7-4.1 3.7-4.2.3 2.6-2.3 4.5-3.7 4.2Z"
                />
              </svg>
            </button>
          </div>
          <p class="register-hint">
            Acesso restrito • <span>Capim Dourado Shopping</span>
          </p>
        </div>
      </section>
    </main>

    <script>
      // Controle do Dropdown Customizado
      const customSelect = document.getElementById("custom-perfil");
      const selectTrigger = document.getElementById("select-trigger");
      const selectedText = document.getElementById("selected-text");
      const hiddenPerfil = document.getElementById("perfil");

      selectTrigger.addEventListener("click", () =>
        customSelect.classList.toggle("open"),
      );

      document.querySelectorAll("#select-options li").forEach((item) => {
        item.addEventListener("click", () => {
          document
            .querySelectorAll("#select-options li")
            .forEach((li) => li.classList.remove("selected"));
          item.classList.add("selected");
          selectedText.textContent = item.textContent;
          hiddenPerfil.value = item.dataset.value;
          customSelect.classList.remove("open");

          document.querySelectorAll("#select-options li").forEach((item) => {
            item.addEventListener("click", () => {
              document
                .querySelectorAll("#select-options li")
                .forEach((li) => li.classList.remove("selected"));
              item.classList.add("selected");
              selectedText.textContent = item.textContent;
              hiddenPerfil.value = item.dataset.value;
              customSelect.classList.remove("open");
            });
          });
        });
      });

      document.addEventListener("click", (e) => {
        if (!customSelect.contains(e.target))
          customSelect.classList.remove("open");
      });

      // Ação de Esqueci minha senha
      document.getElementById("btn-forgot").addEventListener("click", () => {
        const email = document.getElementById("email").value.trim();
        alert(
          email
            ? `Instruções de redefinição enviadas para ${email}.`
            : "Digite seu e-mail acima e clique novamente para redefinir sua senha.",
        );
      });

      function autenticar(email, perfil) {
        localStorage.setItem(
          "capim_gestao_usuario",
          JSON.stringify({
            email: email,
            perfil: perfil,
            acesso: new Date().toLocaleString("pt-BR"),
          }),
        );
        window.location.href = "pages/painel.html";
      }

      document
        .getElementById("form-login")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          autenticar(
            document.getElementById("email").value.trim(),
            document.getElementById("perfil").value,
          );
        });

      document
        .getElementById("btn-google")
        .addEventListener("click", function () {
          autenticar(
            "colaborador.google@capimdourado.com.br",
            "Administrador do Shopping",
          );
        });

      document
        .getElementById("btn-apple")
        .addEventListener("click", function () {
          autenticar(
            "colaborador.apple@capimdourado.com.br",
            "Supervisor Operacional",
          );
        });
    </script>
  </body>
</html>
